<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number Guessing Gamed</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>🎯 Guess The Number</h1>

      <p class="subtitle">
        I'm thinking of number between
        <b>1 and 100</b>
      </p>

      <div class="game-card">
        <input type="number" id="guessInput" placeholder="Enter your guess" />

        <button id="guessBtn">Guess</button>

        <h2 id="message">Start Guessing...</h2>

        <div class="info">
          <div class="box">
            <h3 id="attempts">0</h3>
            <p>Attempts</p>
          </div>

          <div class="box">
            <h3 id="bestScore">--</h3>
            <p>Best Score</p>
          </div>
        </div>
        <button id="restartBtn">🔁 New Game</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
